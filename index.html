<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5c6e">
  <title>Control de Línea</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img id="brandLogo" class="brand-logo" alt="" hidden>
      <div class="brand-text">
        <strong>Control de Línea</strong>
        <span id="brandEmpresa"></span>
      </div>
    </div>
    <div id="topStatus" class="top-status"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button type="button" data-tab="recorrida" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Recorrida
    </button>
    <button type="button" data-tab="final">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>
      Control final
    </button>
    <button type="button" data-tab="reporte">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      Reporte
    </button>
    <button type="button" data-tab="ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      Ajustes
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Orden importa: brand → store → report → app -->
  <script src="js/brand.js"></script>
  <script src="js/store.js"></script>
  <script src="js/report.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
